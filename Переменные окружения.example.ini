Переменные окружения (ШАБЛОН — без реальных значений)

Реальные значения хранятся:
  - локально в "Переменные окружения.ini" (этот файл в .gitignore, в репо НЕ попадает)
  - в консоли Yandex Cloud Function (переменные окружения функции)

TG_BOT_TOKEN=        # токен Telegram-бота
PK_HOST=lady-elka.server.paykeeper.ru
TG_CHAT_IDS=         # chat_id менеджеров через запятую
PK_PASS=             # пароль PayKeeper
HOOK_SECRET=         # секрет для проверки webhook
CORS_ORIGIN=https://lady-elka.ru,https://www.lady-elka.ru
PK_USER=admin

Точка входа: index.handler

Среда выполнения: Node.js / 22

Ссылка для вызова: https://functions.yandexcloud.net/<your-function-id>
